<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divergent Universe</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="app"></div>

    <!-- Login Screen (Wuthering Waves UI style) -->
    <div id="login-screen">
      <div class="login-form">
        <h2>System Login</h2>
        <input type="text" id="username" placeholder="Nickname" autocomplete="off" />
        <input type="password" id="password" placeholder="Password" autocomplete="off" />
        <button id="login-btn">Initialize</button>
        <p id="login-error" style="display: none; color: #ff4a4a; margin-top: 10px; font-size: 14px;">Invalid credentials</p>
      </div>
    </div>

    <!-- God Mode Flash Effect -->
    <div id="god-mode-flash"></div>

    <!-- Build UI Layer -->
    <div id="ui-layer" style="display: none;">
      <!-- Catalog Overlay -->
      <div id="build-catalog">
        <div class="catalog-header">
          <div class="catalog-tab active" data-category="landscape">Ландшафт</div>
          <div class="catalog-tab" data-category="architecture">Архитектура WuWa</div>
          <div class="catalog-tab" data-category="constructor">Конструктор</div>
        </div>

        <div class="catalog-content">
          <div class="catalog-grid active" id="grid-landscape">
            <div class="catalog-item" data-type="mid-poly-rock">
              <div class="icon monolith-icon"></div>
              <span>Mid-poly Rock</span>
            </div>
            <div class="catalog-item" data-type="glass-crystal">
              <div class="icon glass-cube-icon"></div>
              <span>Glass Crystal</span>
            </div>
            <div class="catalog-item" data-type="neon-tree">
              <div class="icon neon-pillar-icon"></div>
              <span>Neon Tree</span>
            </div>
          </div>

          <div class="catalog-grid" id="grid-architecture">
            <div class="catalog-item" data-type="monolith">
              <div class="icon monolith-icon"></div>
              <span>Monolith</span>
            </div>
            <div class="catalog-item" data-type="dark-tower">
              <div class="icon monolith-icon"></div>
              <span>Dark Tower</span>
            </div>
            <div class="catalog-item" data-type="matte-bridge">
              <div class="icon glass-cube-icon"></div>
              <span>Matte Bridge</span>
            </div>
          </div>

          <div class="catalog-grid" id="grid-constructor">
            <div class="catalog-item" data-type="glass-cube">
              <div class="icon glass-cube-icon"></div>
              <span>Glass Cube</span>
            </div>
            <div class="catalog-item" data-type="chrome-block">
              <div class="icon glass-cube-icon" style="background: #ffffff;"></div>
              <span>Chrome Block</span>
            </div>
            <div class="catalog-item" data-type="neon-pillar">
              <div class="icon neon-pillar-icon"></div>
              <span>Neon Pillar</span>
            </div>
            <div class="catalog-item" data-type="matte-metal">
              <div class="icon monolith-icon" style="background: #555566;"></div>
              <span>Matte Metal</span>
            </div>
          </div>
        </div>
      </div>

      <div id="crosshair">+</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
