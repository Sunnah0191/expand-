<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divergent Universe</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="app"></div>

    <!-- Login Screen (Wuthering Waves UI style) -->
    <div id="login-screen">
      <div class="login-form">
        <h2>System Login</h2>
        <input type="text" id="username" placeholder="Ник" autocomplete="off" />
        <input type="password" id="password" placeholder="Пароль" autocomplete="off" />
        <button id="login-btn">Войти</button>
        <p id="login-error" style="display: none; color: #ff4a4a; margin-top: 10px; font-size: 14px;">Invalid credentials</p>
      </div>
    </div>

    <!-- God Mode Flash Effect -->
    <div id="god-mode-flash"></div>

    <!-- Build UI Layer -->
    <div id="ui-layer" style="display: none;">
      <!-- Catalog Overlay -->
      <div id="build-catalog">
        <h3>Строительный каталог</h3>

        <div class="catalog-category">Ландшафт</div>
        <div class="catalog-grid">
          <div class="catalog-item" data-type="landscape-rock">
            <div class="icon monolith-icon"></div>
            <span>Mid-poly скала</span>
          </div>
          <div class="catalog-item" data-type="landscape-crystal">
            <div class="icon glass-cube-icon"></div>
            <span>Стеклянный кристалл</span>
          </div>
          <div class="catalog-item" data-type="landscape-tree">
            <div class="icon neon-pillar-icon"></div>
            <span>Неоновое дерево</span>
          </div>
        </div>

        <div class="catalog-category">Архитектура WuWa</div>
        <div class="catalog-grid">
          <div class="catalog-item" data-type="wuwa-monolith">
            <div class="icon monolith-icon"></div>
            <span>Футуристичный монолит</span>
          </div>
          <div class="catalog-item" data-type="wuwa-tower">
            <div class="icon monolith-icon" style="background:#111; border-color:#333;"></div>
            <span>Левитирующая башня</span>
          </div>
          <div class="catalog-item" data-type="wuwa-bridge">
            <div class="icon" style="background:#555;"></div>
            <span>Матовый мост</span>
          </div>
        </div>

        <div class="catalog-category">Конструктор (Блоки)</div>
        <div class="catalog-grid">
          <div class="catalog-item" data-type="block-glass">
            <div class="icon glass-cube-icon"></div>
            <span>Стекло</span>
          </div>
          <div class="catalog-item" data-type="block-chrome">
            <div class="icon" style="background:#fff; border: 1px solid #ccc;"></div>
            <span>Хром</span>
          </div>
          <div class="catalog-item" data-type="block-neon">
            <div class="icon neon-pillar-icon"></div>
            <span>Неон</span>
          </div>
          <div class="catalog-item" data-type="block-metal">
            <div class="icon" style="background:#888;"></div>
            <span>Матовый металл</span>
          </div>
        </div>
      </div>

      <div id="crosshair">+</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
