<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divergent Universe</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="app"></div>

    <!-- Login Screen (Wuthering Waves UI style) -->
    <div id="login-screen">
      <div class="login-form">
        <h2>System Login</h2>
        <input type="text" id="username" placeholder="Ник" autocomplete="off" />
        <input type="password" id="password" placeholder="Пароль" autocomplete="off" />
        <button id="login-btn">Авторизация</button>
        <p id="login-error" style="display: none; color: #ff4a4a; margin-top: 10px; font-size: 14px;">Invalid credentials</p>
      </div>
    </div>

    <!-- God Mode Flash Effect -->
    <div id="god-mode-flash"></div>

    <!-- Build UI Layer -->
    <div id="ui-layer" style="display: none;">
      <!-- Catalog Overlay -->
      <div id="build-catalog" style="max-height: 80vh; overflow-y: auto;">
        <h3>Каталог строительства</h3>

        <h4 style="margin-top: 10px; margin-bottom: 5px; color: #aaa;">Ландшафт</h4>
        <div class="catalog-grid">
          <div class="catalog-item" data-type="mid-poly-rock">
            <div class="icon"></div>
            <span>Скала</span>
          </div>
          <div class="catalog-item" data-type="glass-crystal">
            <div class="icon"></div>
            <span>Кристалл</span>
          </div>
          <div class="catalog-item" data-type="neon-tree">
            <div class="icon"></div>
            <span>Дерево</span>
          </div>
        </div>

        <h4 style="margin-top: 15px; margin-bottom: 5px; color: #aaa;">Архитектура WuWa</h4>
        <div class="catalog-grid">
          <div class="catalog-item" data-type="wuwa-monolith">
            <div class="icon"></div>
            <span>Монолит</span>
          </div>
          <div class="catalog-item" data-type="dark-tower">
            <div class="icon"></div>
            <span>Башня</span>
          </div>
          <div class="catalog-item" data-type="matte-bridge">
            <div class="icon"></div>
            <span>Мост</span>
          </div>
        </div>

        <h4 style="margin-top: 15px; margin-bottom: 5px; color: #aaa;">Конструктор (Блоки)</h4>
        <div class="catalog-grid">
          <div class="catalog-item" data-type="block-glass">
            <div class="icon"></div>
            <span>Стекло</span>
          </div>
          <div class="catalog-item" data-type="block-chrome">
            <div class="icon"></div>
            <span>Хром</span>
          </div>
          <div class="catalog-item" data-type="block-neon">
            <div class="icon"></div>
            <span>Неон</span>
          </div>
          <div class="catalog-item" data-type="block-matte">
            <div class="icon"></div>
            <span>Матовый</span>
          </div>
        </div>
      </div>

      <div id="crosshair">+</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
