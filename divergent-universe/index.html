<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divergent Universe</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="app"></div>

    <!-- Login Screen (Wuthering Waves UI style) -->
    <div id="login-screen">
      <div class="login-form">
        <h2>System Login</h2>
        <input type="text" id="username" placeholder="Ник" autocomplete="off" />
        <input type="password" id="password" placeholder="Пароль" autocomplete="off" />
        <button id="login-btn">Initialize</button>
        <p id="login-error" style="display: none; color: #ff4a4a; margin-top: 10px; font-size: 14px;">Invalid credentials</p>
      </div>
    </div>

    <!-- God Mode Flash Effect -->
    <div id="god-mode-flash"></div>

    <!-- Build UI Layer -->
    <div id="ui-layer" style="display: none;">
      <!-- Catalog Overlay -->
      <div id="build-catalog">
        <h3>Construction Modules</h3>

        <div class="catalog-category">
          <h4>Ландшафт</h4>
          <div class="catalog-grid">
            <div class="catalog-item" data-type="rock">
              <div class="icon rock-icon"></div>
              <span>Mid-poly скала</span>
            </div>
            <div class="catalog-item" data-type="crystal">
              <div class="icon crystal-icon"></div>
              <span>Стеклянный кристалл</span>
            </div>
            <div class="catalog-item" data-type="tree">
              <div class="icon tree-icon"></div>
              <span>Неоновое дерево</span>
            </div>
          </div>
        </div>

        <div class="catalog-category">
          <h4>Архитектура WuWa</h4>
          <div class="catalog-grid">
            <div class="catalog-item" data-type="wuwa-monolith">
              <div class="icon wuwa-monolith-icon"></div>
              <span>Футуристичный монолит</span>
            </div>
            <div class="catalog-item" data-type="tower">
              <div class="icon tower-icon"></div>
              <span>Левитирующая башня</span>
            </div>
            <div class="catalog-item" data-type="bridge">
              <div class="icon bridge-icon"></div>
              <span>Матовый мост</span>
            </div>
          </div>
        </div>

        <div class="catalog-category">
          <h4>Конструктор (Блоки)</h4>
          <div class="catalog-grid">
            <div class="catalog-item" data-type="glass-cube">
              <div class="icon glass-cube-icon"></div>
              <span>Стекло</span>
            </div>
            <div class="catalog-item" data-type="chrome-cube">
              <div class="icon chrome-cube-icon"></div>
              <span>Хром</span>
            </div>
            <div class="catalog-item" data-type="neon-cube">
              <div class="icon neon-cube-icon"></div>
              <span>Неон</span>
            </div>
            <div class="catalog-item" data-type="metal-cube">
              <div class="icon metal-cube-icon"></div>
              <span>Матовый металл</span>
            </div>
          </div>
        </div>

      </div>

      <div id="crosshair">+</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
