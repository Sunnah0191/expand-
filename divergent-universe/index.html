<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divergent Universe</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="app"></div>

    <!-- Login Screen (Wuthering Waves UI style) -->
    <div id="login-screen">
      <div class="login-form">
        <h2>Система Авторизации</h2>
        <input type="text" id="username" placeholder="Ник" autocomplete="off" />
        <input type="password" id="password" placeholder="Пароль" autocomplete="off" />
        <button id="login-btn">Авторизация</button>
        <p id="login-error" style="display: none; color: #ff4a4a; margin-top: 10px; font-size: 14px;">Неверные учетные данные</p>
      </div>
    </div>

    <!-- God Mode Flash Effect -->
    <div id="god-mode-flash"></div>

    <!-- Build UI Layer -->
    <div id="ui-layer" style="display: none;">
      <!-- Catalog Overlay -->
      <div id="build-catalog">
        <h3>Каталог Строительства</h3>

        <div class="catalog-category">
          <h4>Ландшафт</h4>
          <div class="catalog-grid">
            <div class="catalog-item" data-type="rock">
              <div class="icon rock-icon"></div>
              <span>Скала</span>
            </div>
            <div class="catalog-item" data-type="glass-crystal">
              <div class="icon glass-crystal-icon"></div>
              <span>Стеклянный кристалл</span>
            </div>
            <div class="catalog-item" data-type="neon-tree">
              <div class="icon neon-tree-icon"></div>
              <span>Неоновое дерево</span>
            </div>
          </div>
        </div>

        <div class="catalog-category">
          <h4>Архитектура WuWa</h4>
          <div class="catalog-grid">
            <div class="catalog-item" data-type="wuwa-monolith">
              <div class="icon monolith-icon"></div>
              <span>Монолит</span>
            </div>
            <div class="catalog-item" data-type="wuwa-tower">
              <div class="icon tower-icon"></div>
              <span>Башня</span>
            </div>
            <div class="catalog-item" data-type="wuwa-bridge">
              <div class="icon bridge-icon"></div>
              <span>Мост</span>
            </div>
          </div>
        </div>

        <div class="catalog-category">
          <h4>Конструктор (Блоки)</h4>
          <div class="catalog-grid">
            <div class="catalog-item" data-type="block-glass">
              <div class="icon block-glass-icon"></div>
              <span>Стекло</span>
            </div>
            <div class="catalog-item" data-type="block-chrome">
              <div class="icon block-chrome-icon"></div>
              <span>Хром</span>
            </div>
            <div class="catalog-item" data-type="block-neon">
              <div class="icon block-neon-icon"></div>
              <span>Неон</span>
            </div>
            <div class="catalog-item" data-type="block-metal">
              <div class="icon block-metal-icon"></div>
              <span>Металл</span>
            </div>
          </div>
        </div>
      </div>

      <div id="crosshair">+</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
