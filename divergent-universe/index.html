<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divergent Universe</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="app"></div>

    <!-- Login Screen (Wuthering Waves UI style) -->
    <div id="login-screen">
      <div class="login-form">
        <h2>System Login</h2>
        <input type="text" id="username" placeholder="Nickname" autocomplete="off" />
        <input type="password" id="password" placeholder="Password" autocomplete="off" />
        <button id="login-btn">Initialize</button>
        <p id="login-error" style="display: none; color: #ff4a4a; margin-top: 10px; font-size: 14px;">Invalid credentials</p>
      </div>
    </div>

    <!-- God Mode Flash Effect -->
    <div id="god-mode-flash"></div>

    <!-- Build UI Layer -->
    <div id="ui-layer" style="display: none;">
      <!-- Catalog Overlay -->
      <div id="build-catalog">
        <h3>Construction Modules</h3>
        <div class="catalog-tabs">
          <button class="tab-btn active" data-target="landscape">Landscape</button>
          <button class="tab-btn" data-target="architecture">WuWa Architecture</button>
          <button class="tab-btn" data-target="constructor">Constructor</button>
        </div>
        <div class="catalog-category active" id="landscape">
          <div class="catalog-item" data-type="mid-poly-rock">
            <div class="icon mid-poly-rock-icon"></div>
            <span>Rock</span>
          </div>
          <div class="catalog-item" data-type="glass-crystal">
            <div class="icon glass-crystal-icon"></div>
            <span>Crystal</span>
          </div>
          <div class="catalog-item" data-type="neon-tree">
            <div class="icon neon-tree-icon"></div>
            <span>Tree</span>
          </div>
        </div>
        <div class="catalog-category" id="architecture">
          <div class="catalog-item" data-type="wuwa-monolith">
            <div class="icon wuwa-monolith-icon"></div>
            <span>Monolith</span>
          </div>
          <div class="catalog-item" data-type="dark-tower">
            <div class="icon dark-tower-icon"></div>
            <span>Tower</span>
          </div>
          <div class="catalog-item" data-type="matte-bridge">
            <div class="icon matte-bridge-icon"></div>
            <span>Bridge</span>
          </div>
        </div>
        <div class="catalog-category" id="constructor">
          <div class="catalog-item" data-type="glass-cube">
            <div class="icon glass-cube-icon"></div>
            <span>Glass</span>
          </div>
          <div class="catalog-item" data-type="chrome-block">
            <div class="icon chrome-block-icon"></div>
            <span>Chrome</span>
          </div>
          <div class="catalog-item" data-type="neon-block">
            <div class="icon neon-block-icon"></div>
            <span>Neon</span>
          </div>
          <div class="catalog-item" data-type="matte-metal-block">
            <div class="icon matte-metal-block-icon"></div>
            <span>Metal</span>
          </div>
        </div>
      </div>

      <div id="crosshair">+</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
