<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divergent Universe</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="app"></div>

    <!-- Login Screen (Wuthering Waves UI style) -->
    <div id="login-screen">
      <div class="login-form">
        <h2>Система Авторизации</h2>
        <input type="text" id="username" placeholder="Ник" autocomplete="off" />
        <input type="password" id="password" placeholder="Пароль" autocomplete="off" />
        <button id="login-btn">Авторизация</button>
        <p id="login-error" style="display: none; color: #ff4a4a; margin-top: 10px; font-size: 14px;">Неверные данные</p>
      </div>
    </div>

    <!-- God Mode Flash Effect -->
    <div id="god-mode-flash"></div>

    <!-- Build UI Layer -->
    <div id="ui-layer" style="display: none;">
      <!-- Catalog Overlay -->
      <div id="build-catalog">
        <div class="catalog-header">
            <h3>Режим Строительства</h3>
            <div class="catalog-tabs">
                <button class="catalog-tab active" data-category="landscape">Ландшафт</button>
                <button class="catalog-tab" data-category="wuwa">Архитектура WuWa</button>
                <button class="catalog-tab" data-category="blocks">Конструктор (Блоки)</button>
            </div>
        </div>

        <div class="catalog-content">
            <!-- Ландшафт -->
            <div class="catalog-grid" data-category-grid="landscape">
                <div class="catalog-item" data-type="mid-poly-rock">
                    <div class="icon rock-icon"></div>
                    <span>Скалы</span>
                </div>
                <div class="catalog-item" data-type="glass-crystal">
                    <div class="icon crystal-icon"></div>
                    <span>Стеклянный Кристалл</span>
                </div>
                <div class="catalog-item" data-type="neon-tree">
                    <div class="icon tree-icon"></div>
                    <span>Неоновое Дерево</span>
                </div>
            </div>

            <!-- Архитектура WuWa -->
            <div class="catalog-grid hidden" data-category-grid="wuwa">
                <div class="catalog-item" data-type="futuristic-monolith">
                    <div class="icon monolith-icon"></div>
                    <span>Монолит</span>
                </div>
                <div class="catalog-item" data-type="dark-tower">
                    <div class="icon tower-icon"></div>
                    <span>Темная Башня</span>
                </div>
                <div class="catalog-item" data-type="matte-bridge">
                    <div class="icon bridge-icon"></div>
                    <span>Матовый Мост</span>
                </div>
            </div>

            <!-- Конструктор (Блоки) -->
            <div class="catalog-grid hidden" data-category-grid="blocks">
                <div class="catalog-item" data-type="glass-cube">
                    <div class="icon glass-cube-icon"></div>
                    <span>Стекло</span>
                </div>
                <div class="catalog-item" data-type="chrome-cube">
                    <div class="icon chrome-cube-icon"></div>
                    <span>Хром</span>
                </div>
                <div class="catalog-item" data-type="neon-cube">
                    <div class="icon neon-cube-icon"></div>
                    <span>Неон</span>
                </div>
                <div class="catalog-item" data-type="metal-cube">
                    <div class="icon metal-cube-icon"></div>
                    <span>Матовый Металл</span>
                </div>
            </div>
        </div>
      </div>

      <div id="crosshair">+</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
