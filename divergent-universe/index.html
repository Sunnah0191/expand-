<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divergent Universe</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="app"></div>

    <!-- Login Screen (Wuthering Waves UI style) -->
    <div id="login-screen">
      <div class="login-form">
        <h2>Авторизация</h2>
        <input type="text" id="username" placeholder="Ник" autocomplete="off" />
        <input type="password" id="password" placeholder="Пароль" autocomplete="off" />
        <button id="login-btn">ВОЙТИ</button>
        <p id="login-error" style="display: none; color: #ff4a4a; margin-top: 10px; font-size: 14px;">Неверные учетные данные</p>
      </div>
    </div>

    <!-- God Mode Flash Effect -->
    <div id="god-mode-flash"></div>

    <!-- Build UI Layer -->
    <div id="ui-layer" style="display: none;">
      <!-- Catalog Overlay -->
      <div id="build-catalog">
        <h3>Construction Modules</h3>

        <div class="catalog-category">
          <h4>Ландшафт</h4>
          <div class="catalog-grid">
            <div class="catalog-item" data-type="landscape-rock">
              <div class="icon landscape-rock-icon"></div>
              <span>Rock</span>
            </div>
            <div class="catalog-item" data-type="landscape-tree">
              <div class="icon landscape-tree-icon"></div>
              <span>Tree</span>
            </div>
          </div>
        </div>

        <div class="catalog-category">
          <h4>Архитектура WuWa</h4>
          <div class="catalog-grid">
            <div class="catalog-item" data-type="wuwa-monolith">
              <div class="icon wuwa-monolith-icon"></div>
              <span>Monolith</span>
            </div>
            <div class="catalog-item" data-type="wuwa-bridge">
              <div class="icon wuwa-bridge-icon"></div>
              <span>Bridge</span>
            </div>
          </div>
        </div>

        <div class="catalog-category">
          <h4>Конструктор (Блоки)</h4>
          <div class="catalog-grid">
            <div class="catalog-item" data-type="block-glass">
              <div class="icon block-glass-icon"></div>
              <span>Glass</span>
            </div>
            <div class="catalog-item" data-type="block-chrome">
              <div class="icon block-chrome-icon"></div>
              <span>Chrome</span>
            </div>
          </div>
        </div>

      </div>

      <div id="crosshair">+</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
