<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Расходящаяся вселенная</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Login Screen (Auth) -->
    <div id="auth-screen">
      <div class="auth-form">
        <h1>Авторизация</h1>
        <div class="input-group">
          <label for="username">Ник</label>
          <input type="text" id="username" autocomplete="off" />
        </div>
        <div class="input-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" autocomplete="off" />
        </div>
        <button id="login-btn">Войти</button>
      </div>
    </div>

    <!-- Build Catalog (God Mode) -->
    <div id="build-catalog" class="hidden">
      <div class="catalog-header">
        <h2>Режим Строительства</h2>
        <div class="catalog-categories">
          <button class="category-btn active" data-category="landscape">Ландшафт</button>
          <button class="category-btn" data-category="wuwa">Архитектура WuWa</button>
          <button class="category-btn" data-category="blocks">Конструктор (Блоки)</button>
        </div>
      </div>
      <div class="catalog-content">
        <!-- Landscape -->
        <div class="catalog-grid" id="grid-landscape">
          <div class="catalog-item" data-type="rock">Скалы</div>
          <div class="catalog-item" data-type="crystal">Кристаллы</div>
          <div class="catalog-item" data-type="tree">Неоновые деревья</div>
        </div>
        <!-- WuWa Architecture -->
        <div class="catalog-grid hidden" id="grid-wuwa">
          <div class="catalog-item" data-type="monolith">Монолит</div>
          <div class="catalog-item" data-type="tower">Левитирующая башня</div>
          <div class="catalog-item" data-type="bridge">Матовый мост</div>
        </div>
        <!-- Blocks -->
        <div class="catalog-grid hidden" id="grid-blocks">
          <div class="catalog-item" data-type="glass_block">Стеклянный блок</div>
          <div class="catalog-item" data-type="chrome_block">Хромированный блок</div>
          <div class="catalog-item" data-type="neon_block">Неоновый блок</div>
          <div class="catalog-item" data-type="metal_block">Матовый металл</div>
        </div>
      </div>
    </div>

    <!-- Reticle for God Mode Building -->
    <div id="reticle" class="hidden"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
