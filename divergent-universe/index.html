<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divergent Universe</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="app"></div>

    <!-- Login Screen (Wuthering Waves UI style) -->
    <div id="login-screen">
      <div class="login-form">
        <h2>System Login</h2>
        <input type="text" id="username" placeholder="Nickname" autocomplete="off" />
        <input type="password" id="password" placeholder="Password" autocomplete="off" />
        <button id="login-btn">Initialize</button>
        <p id="login-error" style="display: none; color: #ff4a4a; margin-top: 10px; font-size: 14px;">Invalid credentials</p>
      </div>
    </div>

    <!-- God Mode Flash Effect -->
    <div id="god-mode-flash"></div>

    <!-- Build UI Layer -->
    <div id="ui-layer" style="display: none;">
      <!-- Catalog Overlay -->
      <div id="build-catalog">
        <h3>Construction Modules</h3>

        <div class="catalog-tabs">
          <button class="tab-btn active" data-tab="landscape">Ландшафт</button>
          <button class="tab-btn" data-tab="wuwa">Архитектура WuWa</button>
          <button class="tab-btn" data-tab="constructor">Конструктор (Блоки)</button>
        </div>

        <div class="catalog-content">
          <!-- Ландшафт -->
          <div class="catalog-category active" id="tab-landscape">
            <div class="catalog-grid">
              <div class="catalog-item" data-type="rock">
                <div class="icon rock-icon"></div>
                <span>Rock</span>
              </div>
              <div class="catalog-item" data-type="crystal">
                <div class="icon crystal-icon"></div>
                <span>Crystal</span>
              </div>
              <div class="catalog-item" data-type="neon-tree">
                <div class="icon neon-tree-icon"></div>
                <span>Neon Tree</span>
              </div>
            </div>
          </div>

          <!-- Архитектура WuWa -->
          <div class="catalog-category" id="tab-wuwa">
            <div class="catalog-grid">
              <div class="catalog-item" data-type="wuwa-monolith">
                <div class="icon monolith-icon"></div>
                <span>Monolith</span>
              </div>
              <div class="catalog-item" data-type="dark-tower">
                <div class="icon dark-tower-icon"></div>
                <span>Dark Tower</span>
              </div>
              <div class="catalog-item" data-type="matte-bridge">
                <div class="icon matte-bridge-icon"></div>
                <span>Matte Bridge</span>
              </div>
            </div>
          </div>

          <!-- Конструктор (Блоки) -->
          <div class="catalog-category" id="tab-constructor">
            <div class="catalog-grid">
              <div class="catalog-item" data-type="glass-block">
                <div class="icon glass-cube-icon"></div>
                <span>Glass</span>
              </div>
              <div class="catalog-item" data-type="chrome-block">
                <div class="icon chrome-block-icon"></div>
                <span>Chrome</span>
              </div>
              <div class="catalog-item" data-type="neon-block">
                <div class="icon neon-pillar-icon"></div>
                <span>Neon</span>
              </div>
              <div class="catalog-item" data-type="metal-block">
                <div class="icon metal-block-icon"></div>
                <span>Metal</span>
              </div>
            </div>
          </div>
        </div>

      </div>

      <div id="crosshair">+</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
