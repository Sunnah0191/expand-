<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divergent Universe</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="app"></div>

    <!-- Login Screen (Wuthering Waves UI style) -->
    <div id="login-screen">
      <div class="login-form">
        <h2>System Login</h2>
        <input type="text" id="username" placeholder="Nickname" autocomplete="off" />
        <input type="password" id="password" placeholder="Password" autocomplete="off" />
        <button id="login-btn">Initialize</button>
        <p id="login-error" style="display: none; color: #ff4a4a; margin-top: 10px; font-size: 14px;">Invalid credentials</p>
      </div>
    </div>

    <!-- God Mode Flash Effect -->
    <div id="god-mode-flash"></div>

    <!-- Build UI Layer -->
    <div id="ui-layer" style="display: none;">
      <!-- Catalog Overlay -->
      <div id="build-catalog">
        <h3>Конструктор</h3>

        <div class="category-title">Ландшафт</div>
        <div class="catalog-grid">
          <div class="catalog-item" data-type="landscape-rock">
            <div class="icon rock-icon"></div>
            <span>Скалы</span>
          </div>
          <div class="catalog-item" data-type="landscape-crystal">
            <div class="icon crystal-icon"></div>
            <span>Кристаллы</span>
          </div>
          <div class="catalog-item" data-type="landscape-tree">
            <div class="icon tree-icon"></div>
            <span>Деревья</span>
          </div>
        </div>

        <div class="category-title">Архитектура WuWa</div>
        <div class="catalog-grid">
          <div class="catalog-item" data-type="wuwa-monolith">
            <div class="icon monolith-icon"></div>
            <span>Монолит</span>
          </div>
          <div class="catalog-item" data-type="wuwa-tower">
            <div class="icon tower-icon"></div>
            <span>Башня</span>
          </div>
          <div class="catalog-item" data-type="wuwa-bridge">
            <div class="icon bridge-icon"></div>
            <span>Мост</span>
          </div>
        </div>

        <div class="category-title">Конструктор (Блоки)</div>
        <div class="catalog-grid">
          <div class="catalog-item" data-type="block-glass">
            <div class="icon glass-cube-icon"></div>
            <span>Стекло</span>
          </div>
          <div class="catalog-item" data-type="block-chrome">
            <div class="icon chrome-icon"></div>
            <span>Хром</span>
          </div>
          <div class="catalog-item" data-type="block-neon">
            <div class="icon neon-pillar-icon"></div>
            <span>Неон</span>
          </div>
          <div class="catalog-item" data-type="block-metal">
            <div class="icon metal-icon"></div>
            <span>Металл</span>
          </div>
        </div>
      </div>

      <div id="crosshair">+</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
