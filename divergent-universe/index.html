<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divergent Universe</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="app"></div>

    <!-- Login Screen (Wuthering Waves UI style) -->
    <div id="login-screen">
      <div class="login-form">
        <h2>Вход в Систему</h2>
        <input type="text" id="username" placeholder="Ник" autocomplete="off" />
        <input type="password" id="password" placeholder="Пароль" autocomplete="off" />
        <button id="login-btn">Инициализация</button>
        <p id="login-error" style="display: none; color: #ff4a4a; margin-top: 10px; font-size: 14px;">Неверные данные</p>
      </div>
    </div>

    <!-- God Mode Flash Effect -->
    <div id="god-mode-flash"></div>

    <!-- Build UI Layer -->
    <div id="ui-layer" style="display: none;">
      <!-- Catalog Overlay -->
      <div id="build-catalog">
        <div class="catalog-tabs">
          <div class="catalog-tab active" data-tab="landscape">Ландшафт</div>
          <div class="catalog-tab" data-tab="architecture">Архитектура WuWa</div>
          <div class="catalog-tab" data-tab="blocks">Конструктор (Блоки)</div>
        </div>
        <div class="catalog-grids">
            <div class="catalog-grid active" id="grid-landscape">
              <div class="catalog-item" data-type="rock">
                <div class="icon rock-icon"></div>
                <span>Скалы</span>
              </div>
              <div class="catalog-item" data-type="crystal">
                <div class="icon crystal-icon"></div>
                <span>Кристалл</span>
              </div>
              <div class="catalog-item" data-type="neon-tree">
                <div class="icon neon-tree-icon"></div>
                <span>Древо</span>
              </div>
            </div>

            <div class="catalog-grid" id="grid-architecture">
              <div class="catalog-item" data-type="monolith">
                <div class="icon monolith-icon"></div>
                <span>Монолит</span>
              </div>
              <div class="catalog-item" data-type="tower">
                <div class="icon tower-icon"></div>
                <span>Башня</span>
              </div>
              <div class="catalog-item" data-type="bridge">
                <div class="icon bridge-icon"></div>
                <span>Мост</span>
              </div>
            </div>

            <div class="catalog-grid" id="grid-blocks">
              <div class="catalog-item" data-type="glass-cube">
                <div class="icon glass-cube-icon"></div>
                <span>Стекло</span>
              </div>
              <div class="catalog-item" data-type="chrome-cube">
                <div class="icon chrome-cube-icon"></div>
                <span>Хром</span>
              </div>
              <div class="catalog-item" data-type="neon-cube">
                <div class="icon neon-cube-icon"></div>
                <span>Неон</span>
              </div>
              <div class="catalog-item" data-type="metal-cube">
                <div class="icon metal-cube-icon"></div>
                <span>Металл</span>
              </div>
            </div>
        </div>
      </div>

      <div id="crosshair">+</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
